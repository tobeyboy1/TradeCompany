<!-- templates/api/modal_base.html -->
<div class="container-fluid">
    <!-- Заголовок торговой точки -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card bg-light">
                <div class="card-body">
                    <h4 class="card-title mb-0">
                        <i class="bi bi-shop"></i> {{ retail_outlet.name }}
                    </h4>
                    <p class="card-text text-muted mb-0">
                        <i class="bi bi-geo-alt"></i> {{ retail_outlet.address }}
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="row">
        <div class="col-12">
            <ul class="nav nav-tabs" id="outletTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab == 'warehouse' %}active{% endif %}" 
                            id="warehouse-tab" 
                            data-bs-toggle="tab" 
                            data-bs-target="#warehouse" 
                            type="button" 
                            role="tab"
                            data-tab="warehouse">
                        <i class="bi bi-box-seam"></i> Склад
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab == 'supplies' %}active{% endif %}" 
                            id="supplies-tab" 
                            data-bs-toggle="tab" 
                            data-bs-target="#supplies" 
                            type="button" 
                            role="tab"
                            data-tab="supplies">
                        <i class="bi bi-truck"></i> Поставки
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab == 'orders' %}active{% endif %}" 
                            id="orders-tab" 
                            data-bs-toggle="tab" 
                            data-bs-target="#orders" 
                            type="button" 
                            role="tab"
                            data-tab="orders">
                        <i class="bi bi-cart"></i> Заказы
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link {% if active_tab == 'employees' %}active{% endif %}" 
                            id="employees-tab" 
                            data-bs-toggle="tab" 
                            data-bs-target="#employees" 
                            type="button" 
                            role="tab"
                            data-tab="employees">
                        <i class="bi bi-people"></i> Сотрудники
                    </button>
                </li>
            </ul>
            
            <!-- Содержимое вкладок -->
            <div class="tab-content" id="outletTabContent">
                <div class="tab-pane fade {% if active_tab == 'warehouse' %}show active{% endif %}" 
                     id="warehouse" 
                     role="tabpanel">
                    {% include 'api/tabs/warehouse_tab.html' %}
                </div>
                <div class="tab-pane fade {% if active_tab == 'supplies' %}show active{% endif %}" 
                     id="supplies" 
                     role="tabpanel">
                    {% include 'api/tabs/supplies_tab.html' %}
                </div>
                <div class="tab-pane fade {% if active_tab == 'orders' %}show active{% endif %}" 
                     id="orders" 
                     role="tabpanel">
                    {% include 'api/tabs/orders_tab.html' %}
                </div>
                <div class="tab-pane fade {% if active_tab == 'employees' %}show active{% endif %}" 
                     id="employees" 
                     role="tabpanel">
                    {% include 'api/tabs/employees_tab.html' %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Обработка переключения вкладок
document.addEventListener('DOMContentLoaded', function() {
    const tabButtons = document.querySelectorAll('#outletTabs button[data-tab]');
    
    tabButtons.forEach(button => {
        button.addEventListener('click', function() {
            const tab = this.getAttribute('data-tab');
            
            // Обновляем URL без перезагрузки страницы
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('tab', tab);
            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
            
            // Инициализируем компоненты вкладки после загрузки
            setTimeout(() => {
                const tabPane = document.querySelector(`#${tab}`);
                if (tabPane) {
                    if (tab === 'warehouse') {
                        if (typeof initWarehouseComponents === 'function') initWarehouseComponents();
                    } else if (tab === 'supplies') {
                        if (typeof initSuppliesComponents === 'function') initSuppliesComponents();
                    } else if (tab === 'orders') {
                        if (typeof initOrdersComponents === 'function') initOrdersComponents();
                    } else if (tab === 'employees') {
                        if (typeof initEmployeesComponents === 'function') initEmployeesComponents();
                    }
                }
            }, 100);
        });
    });
    
    // Инициализируем активную вкладку
    const activeTabPane = document.querySelector(`#${'{{ active_tab }}'}`);
    if (activeTabPane) {
        setTimeout(() => {
            if ('{{ active_tab }}' === 'warehouse') {
                if (typeof initWarehouseComponents === 'function') initWarehouseComponents();
            } else if ('{{ active_tab }}' === 'supplies') {
                if (typeof initSuppliesComponents === 'function') initSuppliesComponents();
            } else if ('{{ active_tab }}' === 'orders') {
                if (typeof initOrdersComponents === 'function') initOrdersComponents();
            } else if ('{{ active_tab }}' === 'employees') {
                if (typeof initEmployeesComponents === 'function') initEmployeesComponents();
            }
        }, 100);
    }
});
</script>
